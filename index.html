<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mandados</title>
<link rel="icon" id="appIcon">
<link rel="manifest" id="appManifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0f1720; --card:#182330; --line:#26364a; --text:#e8eef5; --mute:#8ea0b4;
  --pend:#f2b84b; --ok:#5fd0a0; --com:#a99bff; --bad:#ff7a7a;
  --r:18px; color-scheme:dark;
  --font:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body{padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.num,.big,.mid,.bal,.total strong{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1rem;margin:26px 0 10px;color:var(--mute);font-weight:600}
.net{font-size:.75rem;color:var(--pend);border:1px solid var(--pend);border-radius:99px;padding:3px 10px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:linear-gradient(160deg,var(--card),#131d29);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 6px 20px #0006;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.98)}
.card.pend{border-top:3px solid var(--pend)} .card.cob{border-top:3px solid var(--ok)}
.lbl{margin:0;font-size:.8rem;color:var(--mute)}
.big{margin:8px 0 0;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.pend .big{color:var(--pend)} .cob .big{color:var(--ok)}

.debtors{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.debtors li{transition:transform .15s,border-color .15s;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.who{flex:1;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute)}
.bal{font-weight:700;color:var(--pend)}
.empty{color:var(--mute);text-align:center;padding:24px 0}

button{font:inherit;color:inherit;border:0;border-radius:12px;min-height:48px;padding:0 18px;cursor:pointer}
.primary{background:var(--ok);color:#06241a;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line)}
.wa{background:#25d366;color:#04210f;font-weight:700}
.pill{background:var(--ok);color:#06241a;font-weight:700;min-height:44px}
button:active{transform:scale(.97)}
.debtors li:active{transform:scale(.99);border-color:var(--pend)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--com);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--pend);color:#2b1c00;font-weight:700;box-shadow:0 6px 24px #0008;min-height:54px;padding:0 24px;border-radius:99px}

dialog{max-height:92vh;overflow:auto;border:0;padding:0;background:var(--card);color:var(--text);width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;border-top:1px solid var(--line)}
dialog::backdrop{background:#000a}
dialog>form,dialog>div{padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
h3{margin:0;font-size:1.1rem}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:50px;width:100%}
.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);border-radius:12px;padding:14px;border:1px dashed var(--line)}
.total strong{font-size:1.5rem;color:var(--pend)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:38px;font-size:.85rem;background:var(--bg);border:1px solid var(--line)}
.items{margin:0;padding:0;list-style:none;font-size:.88rem;color:var(--mute);display:grid;gap:6px}
.items li{display:flex;align-items:center;gap:8px}
.items small{display:block;font-size:.78rem;opacity:.85}
.items .main{flex:1;min-width:0;overflow-wrap:anywhere}
.items .amt{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px}
.act button{min-height:40px;min-width:40px;padding:0;font-size:1rem;background:var(--bg);border:1px solid var(--line)}
.danger{background:var(--bad);color:#2a0606;font-weight:700}
#cMsg{margin:0;color:var(--mute)}
[hidden]{display:none!important}
h4{margin:2px 0 -6px;font-size:.85rem;color:var(--mute);font-weight:600}
pre.msg{margin:0;white-space:pre-wrap;font:inherit;font-size:.88rem;background:var(--bg);border-radius:12px;padding:14px;border:1px solid var(--line);max-height:38vh;overflow:auto}

/* Interruptor Debe / Pago */
.sw{display:flex;width:max-content;margin-top:6px;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.sw button{min-height:30px;min-width:60px;padding:0 12px;font-size:.78rem;border-radius:0;background:var(--bg);color:var(--mute)}
.sw button.on-debe{background:var(--pend);color:#2b1c00;font-weight:700}
.sw button.on-pago{background:var(--ok);color:#06241a;font-weight:700}
.items li.paid .amt{color:var(--ok);text-decoration:line-through}
.hint{margin:0;font-size:.8rem;color:var(--mute);text-align:center}
.sum em{display:block;margin-top:2px;font-style:normal;font-size:.68rem;color:var(--ok)}
/* Resumen de totales (detalle del cliente) */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.sum small{display:block;font-size:.7rem;color:var(--mute);line-height:1.2;min-height:2.4em}
.sum strong{display:block;margin-top:4px;font-size:.98rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum .s-loan strong{color:var(--text)} .sum .s-paid strong{color:var(--ok)} .sum .s-bal{border-color:var(--pend)} .sum .s-bal strong{color:var(--pend)}
/* Comprobante (imagen) - diseño AMBV MAO */
.rcpt-prev{text-align:center}
.rcpt-prev img{display:block;margin:0 auto;width:auto;max-width:100%;max-height:46vh;border-radius:12px;border:1px solid var(--line)}
.rcpt-stage{position:fixed;left:-10000px;top:0;width:max-content;background:#fff;pointer-events:none}
.rcpt{width:480px;background:#fff;color:#10285f;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.25;text-align:left;overflow:hidden}
.rcpt.wide{width:760px}
.rcpt *{box-sizing:border-box}
.rcpt .hand{font-family:"Kalam","Segoe Print","Comic Sans MS",cursive}
.rcpt p{margin:0}
.r-head{background:#10285f;color:#fff;padding:18px 18px 22px 20px;border-bottom:5px solid #ffc933;border-radius:0 0 36px 36px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.r-hl{min-width:0;flex:1}
.r-biz{font-size:1rem;font-weight:700;color:#ffc933;letter-spacing:.04em;overflow-wrap:anywhere}
.r-title{display:inline;font-size:1.75rem;line-height:1.25;font-weight:700;color:#fff;background:linear-gradient(transparent 80%,#ffc933 80%,#ffc933 92%,transparent 92%)}
.r-tw{margin:2px 0 8px}
.r-date{display:flex;align-items:center;gap:10px;margin-top:4px;background:#ffc933;color:#10285f;border-radius:14px;padding:6px 14px 6px 10px;width:max-content;max-width:100%}
.r-date svg{width:30px;height:30px;flex:none;stroke:#10285f}
.r-date span{display:block;min-width:0}
.r-date small{display:block;font-size:.8rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;color:#10285f}
.r-date b{display:block;font-size:1.45rem;font-weight:900;line-height:1.15;color:#0b1c45;white-space:nowrap}
.r-hr{display:flex;align-items:center;gap:4px;flex:none}
.r-tag{width:92px;font-size:.88rem;line-height:1.15;font-weight:700;color:#ffc933;text-align:center}
.r-frame{margin:14px 14px 0;border:2px solid #ffc933;border-radius:22px;padding:12px;background:#fffdf6;display:grid;gap:12px}
.r-cli{display:flex;align-items:center;gap:12px;background:#fff1bd;border-radius:16px;padding:10px 12px}
.r-av{width:52px;height:52px;border-radius:50%;background:#ffd45e;display:flex;align-items:center;justify-content:center;flex:none}
.r-cn{min-width:0;flex:1}
.r-cn small{display:block;font-size:.72rem;letter-spacing:.12em;font-weight:800;color:#10285f}
.r-cn b{display:block;font-size:1.55rem;line-height:1.15;color:#0b1c45;overflow-wrap:anywhere}
.r-thx{flex:none;max-width:110px;text-align:right;font-size:.95rem;line-height:1.15;font-weight:700;color:#10285f}
.r-blk{display:grid;gap:6px}
.r-blk.green{background:#f1fbe9;border:1.5px solid #cdeebd;border-radius:16px;padding:10px}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.r-gc{display:grid;gap:6px;min-width:0}
.r-sh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.r-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#cfe0fb}
.green .r-ic{background:#c4ecab}
.r-sn{display:inline-block;font-size:1.3rem;font-weight:700;letter-spacing:.02em;color:#10285f;border-bottom:3px solid #3a86ef;line-height:1.2}
.green .r-sn{border-bottom-color:#2fb344}
.r-it{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e8f0fb;border-radius:10px;padding:7px 10px}
.green .r-it{background:#e3f6d6}
.r-t{min-width:0;overflow-wrap:anywhere}
.r-t b{display:block;font-size:1rem;font-weight:800;color:#0b1c45}
.r-t small{display:block;font-size:.8rem;font-weight:600;color:#2c4a8f}
.r-pill{flex:none;background:#ffe38a;border-radius:99px;padding:5px 14px;font-weight:800;font-size:1.02rem;color:#0b1c45;white-space:nowrap}
.green .r-pill{background:#c6f09c}
.r-tot{display:flex;align-items:center;gap:12px;background:#e3eefb;border:1.5px solid #a9c6ef;border-radius:16px;padding:10px 14px}
.r-ti{width:46px;height:46px;border-radius:50%;background:#10285f;display:flex;align-items:center;justify-content:center;flex:none}
.r-tl{flex:1;min-width:0}
.r-tr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0;font-size:1.1rem;font-weight:700;color:#10285f}
.r-tr+.r-tr{border-top:1.5px solid #7fa6e6}
.r-tr strong{font-family:"Nunito",system-ui,sans-serif;font-weight:800;color:#0b1c45;font-size:1.1rem}
.r-sal{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffd54a;border-radius:16px;padding:10px 12px}
.r-sal.ok{background:#b9ecc6}
.r-sl{display:flex;align-items:center;gap:8px;min-width:0;font-size:1.2rem;line-height:1.1;font-weight:700;color:#0b1c45}
.r-sl em{display:block;font-style:normal;font-size:.8rem;font-weight:700;color:#0b3d22;margin-top:2px}
.r-ap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;padding:6px 4px 0;border-top:1.5px dashed #9bd67f;font-weight:800;font-size:1.05rem;color:#14532d}
.r-sh+.r-ap{border-top:0;margin-top:0;padding-top:0}
.r-big{flex:none;background:#0b1c45;color:#ffd54a;border-radius:12px;padding:6px 14px;font-weight:800;font-size:1.5rem;white-space:nowrap}
.r-sal.ok .r-big{color:#b9ecc6}
.rcpt.two{width:700px}
.r-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.r-col{min-width:0}
.r-col .r-blk{height:100%}
.two .r-sn{font-size:1.08rem}
.two .r-ic{width:34px;height:34px}
.two .r-ic svg{width:22px;height:22px}
.r-blk:not(.green) .r-ap{border-top-color:#a9c6ef;color:#10285f}
.r-foot{margin-top:14px;background:#10285f;border-top:5px solid #ffc933;border-radius:36px 36px 0 0;padding:14px 20px 16px;text-align:center}
.r-foot .a{font-size:1.25rem;font-weight:700;color:#ffc933}
.r-foot .b{margin-top:2px;font-size:.8rem;letter-spacing:.06em;color:#dbe6ff}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Mandados</h1>
  <span id="net" class="net" hidden>Sin conexión</span>
</header>

<main>
  <section class="cards" aria-label="Resumen">
    <article class="card pend">
      <p class="lbl">Pendiente por cobrar</p>
      <p class="big" id="sPend">$0</p>
    </article>
    <article class="card cob">
      <p class="lbl">Cobrado este mes</p>
      <p class="big" id="sCob">$0</p>
    </article>
  </section>

  <section aria-label="Deudores">
    <h2>Quién me debe</h2>
    <ul id="debtors" class="debtors"></ul>
    <p id="empty" class="empty" hidden>Nadie te debe nada. Registra un mandado con el botón +.</p>
  </section>
</main>

<button class="fab" id="btnNew" aria-label="Nuevo mandado">+ Mandado</button>

<!-- Nuevo mandado -->
<dialog id="dNew">
  <form id="fNew" method="dialog" autocomplete="off">
    <h3>Nuevo mandado</h3>
    <label>Cliente
      <input id="fClient" list="clientList" required placeholder="Nombre">
      <datalist id="clientList"></datalist>
    </label>
    <label>Concepto
      <input id="fConcept" required placeholder="Ej. Pago de recibo, compra en farmacia">
    </label>
    <label>Dinero prestado / gastado
      <input id="fLent" data-money inputmode="numeric" pattern="[1-9][0-9.]*" title="Escribe un monto mayor a 0" autocomplete="off" required placeholder="0">
    </label>
    <label>Fecha del préstamo
      <input id="fDate" type="date" required>
    </label>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Cobrar -->
<dialog id="dPay">
  <div id="payBody"></div>
</dialog>

<!-- Detalle de un abono del historial / reenvío del comprobante -->
<dialog id="dDetail">
  <div id="detBody"></div>
</dialog>

<!-- Editar préstamo / abono -->
<dialog id="dEdit">
  <form id="fEdit" method="dialog" autocomplete="off">
    <h3 id="eTitle"></h3>
    <label id="eConceptL">Concepto
      <input id="eConcept">
    </label>
    <label>Monto
      <input id="eAmt" data-money inputmode="numeric" pattern="[1-9][0-9.]*" title="Escribe un monto mayor a 0" autocomplete="off" required>
    </label>
    <label>Fecha
      <input id="eDate" type="date" required>
    </label>
    <label id="eMethodL">Método de pago
      <select id="eMethod"></select>
    </label>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Confirmar eliminación -->
<dialog id="dConfirm">
  <form method="dialog">
    <h3>Confirmar eliminación</h3>
    <p id="cMsg"></p>
    <div class="actions">
      <button value="cancel" class="ghost">Cancelar</button>
      <button value="ok" class="danger" id="cOk">Eliminar</button>
    </div>
    <button value="paid" class="primary" id="cPaid" hidden>✅ Ya pagado: borrar y registrar abono</button>
  </form>
</dialog>

<div id="toast" class="toast" role="status"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, collection, onSnapshot, query, orderBy,
  doc, writeBatch, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// Credenciales del proyecto de Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBRhbzLFtKR41IXqLJlSSTkkbNvGpHBlCY",
  authDomain: "cuenta-personal-da750.firebaseapp.com",
  projectId: "cuenta-personal-da750",
  storageBucket: "cuenta-personal-da750.firebasestorage.app",
  messagingSenderId: "332207701046",
  appId: "1:332207701046:web:8a46f21530e809839dec97",
  measurementId: "G-9WZ73BQZSH"
};

// Formato de dinero (cámbialo a tu país)
const LOCALE = "es-CO";
const CURRENCY = "COP";

/* ---------- Ícono y manifest (PWA sin archivos externos) ---------- */
const icon = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f1720"/><circle cx="32" cy="32" r="19" fill="#f2b84b"/></svg>');
document.getElementById("appIcon").href = icon;
document.getElementById("appManifest").href = URL.createObjectURL(new Blob([JSON.stringify({
  name: "Mandados", short_name: "Mandados", display: "standalone",
  background_color: "#0f1720", theme_color: "#0f1720",
  icons: [{ src: icon, sizes: "any", type: "image/svg+xml", purpose: "any maskable" }]
})], { type: "application/manifest+json" }));

const app = initializeApp(firebaseConfig);
// Caché local: funciona sin conexión y sincroniza al volver internet
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat(LOCALE, { style: "currency", currency: CURRENCY, maximumFractionDigits: 0 }).format(n || 0);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.trim().toLowerCase();

/* ---------- Dinero con puntos de miles en tiempo real ---------- */
const grp = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const getMoney = el => +el.value.replace(/\D/g, "") || 0;          // valor numérico puro (sin puntos)
const setMoney = (el, n) => { el.value = n > 0 ? grp(n) : ""; };
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches?.("[data-money]")) return;
  const pos = el.selectionStart ?? el.value.length;
  const before = el.value.slice(0, pos).replace(/\D/g, "").length;
  el.value = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  let i = 0, n = 0;
  while (i < el.value.length && n < before) if (/\d/.test(el.value[i++])) n++;
  try { el.setSelectionRange(i, i); } catch {}
});
const dateOf = x => x?.toDate?.() || new Date();
const sameMonth = d => { const n = new Date(); return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear(); };

const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => ymd(new Date());
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString(LOCALE, { day: "numeric", month: "short", year: "numeric" });
const dayOf = x => x.date || ymd(dateOf(x.createdAt)); // registros viejos usan su fecha de creación
const byDay = (a, b) => dayOf(a).localeCompare(dayOf(b));

let errands = [], payments = [], currentKey = null;

function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ---------- Datos en tiempo real ---------- */
const onErr = e => toast("Error: " + e.message);
onSnapshot(query(collection(db, "mandados"), orderBy("createdAt", "asc")),
  s => { errands = s.docs.map(d => ({ id: d.id, ...d.data() })).sort(byDay); render(); }, onErr);
onSnapshot(query(collection(db, "pagos"), orderBy("createdAt", "asc")),
  s => { payments = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onErr);

// Totales del cliente: préstamos, abonos y saldo (préstamos − abonos)
const totalsFrom = (errs, pays) => {
  const loans = errs.reduce((s, e) => s + e.total, 0), paid = pays.reduce((s, p) => s + p.amount, 0);
  return { loans, paid, balance: Math.max(0, loans - paid) };
};
const pendingOf = e => Math.max(0, e.total - (e.paid || 0));

function groups() {
  const m = new Map();
  for (const e of errands) {
    const k = norm(e.client);
    const g = m.get(k) || { key: k, name: e.client, balance: 0, count: 0 };
    const p = pendingOf(e);
    g.balance += p; if (p > 0) g.count++;
    m.set(k, g);
  }
  return [...m.values()];
}

/* ---------- Métodos de pago ---------- */
const METHODS = { efectivo: "💵 Efectivo", transferencia: "🏦 Transferencia / Nequi / Daviplata", encargo: "📦 Encargo / Producto", otro: "📝 Otro" };
const MS = { efectivo: "Efectivo", transferencia: "Transferencia", encargo: "Encargo / Producto", otro: "Otro" };
const methodOptions = sel => Object.entries(METHODS).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${v}</option>`).join("");
const payLabel = p => `${money(p.amount)}${MS[p.method] ? " - " + MS[p.method] : ""}`;

/* ---------- Escritura en Firestore con recálculo de saldos ---------- */
const clientErrs = k => errands.filter(e => norm(e.client) === k);
// Abonos vigentes del cliente. Los "settled" son cobros de préstamos ya borrados: solo cuentan en "Cobrado este mes"
const clientPays = k => payments.filter(p => p.key === k && !p.settled);
const pendingErrs = k => clientErrs(k).filter(e => pendingOf(e) > 0);

// Reparte los abonos entre los préstamos:
// 1) un abono con "covers" paga primero los préstamos que el usuario marcó como Pago
// 2) lo que sobra (y los abonos sin "covers") se reparte del préstamo más antiguo al más reciente
function allocateDetailed(errs, pays) {
  const sorted = [...errs].sort(byDay), cap = {}, paid = {}, from = {}, pool = [];
  for (const e of sorted) { cap[e.id] = e.total; paid[e.id] = 0; from[e.id] = {}; }
  const give = (id, p, a) => { cap[id] -= a; paid[id] += a; from[id][p.id] = (from[id][p.id] || 0) + a; };
  for (const p of [...pays].sort(byDay)) {
    let left = p.amount;
    for (const id of p.covers || []) if (id in cap && left > 0) { const a = Math.min(left, cap[id]); if (a > 0) { give(id, p, a); left -= a; } }
    if (left > 0) pool.push({ p, left });
  }
  for (const e of sorted) for (const q of pool) {
    if (cap[e.id] <= 0) break;
    const a = Math.min(q.left, cap[e.id]); if (a > 0) { give(e.id, q.p, a); q.left -= a; }
  }
  return { paid, from };
}
const allocate = (errs, pays) => allocateDetailed(errs, pays).paid;
// Aplica el cambio y actualiza el campo "paid" de los préstamos afectados, todo en un solo lote
function commit(errs, pays, ops) {
  const paid = allocate(errs, pays), batch = writeBatch(db);
  ops(batch, paid);
  for (const e of errs) if (!e.isNew && (e.paid || 0) !== paid[e.id]) batch.update(doc(db, "mandados", e.id), { paid: paid[e.id] });
  batch.commit().catch(onErr); // sin await: también funciona sin conexión
}

const ask = (msg, o = {}) => new Promise(res => {

  $("#cPaid").hidden = !o.paid; $("#cOk").textContent = o.ok || "Eliminar";
  d.onclose = () => res(d.returnValue); d.showModal();
});

// Marcar/desmarcar un préstamo como Pago suma/resta su valor exacto en "Monto recibido" (que sigue siendo editable)
function toggleMark(e, on) {
  if (on === marks.has(e.id)) return;
  on ? marks.add(e.id) : marks.delete(e.id);
  const inp = $("#pAmt");
  if (inp) setMoney(inp, Math.max(0, getMoney(inp) + (on ? 1 : -1) * pendingOf(e)));
}

// Simula el abono para saber qué préstamos quedan cubiertos (Pago) y cuáles siguen pendientes (Debe)
function buildPlan(k, amount, date, method, covers, saved) {
  const errs = clientErrs(k), list = pendingErrs(k), name = errs[0]?.client || "";
  const hist = clientPays(k).sort(byDay);
  amount = Math.min(amount, list.reduce((s, e) => s + pendingOf(e), 0));
  const cov = covers.filter(id => list.some(e => e.id === id));
  const after = allocate(errs, amount > 0 ? [...hist, { id: "__nuevo", amount, date, method, covers: cov }] : hist);
  const detail = list.map(e => {
    const applied = Math.max(0, after[e.id] - (e.paid || 0)), left = e.total - after[e.id];
    return { id: e.id, concept: e.concept, date: dayOf(e), total: e.total, applied, left, status: left <= 0 ? "pago" : "debe" };
  });
  const loans = errs.reduce((s, e) => s + e.total, 0), paid = hist.reduce((s, p) => s + p.amount, 0) + amount;
  return {
    name, amount, detail, hist, method: amount > 0 ? method : "", saved, date: amount > 0 ? date : today(),
    remaining: Math.max(0, loans - paid), totals: { loans, paid, balance: Math.max(0, loans - paid) },
    pay: { amount, date, method, covers: cov }, coveredIds: detail.filter(x => x.status === "pago").map(x => x.id)
  };
}

// Guarda el abono en Firestore (con los préstamos que cubre) y recalcula el "paid" de cada préstamo
function registerPay(k, plan) {
  const p = plan.pay, errs = clientErrs(k), name = errs[0]?.client || "", ref = doc(collection(db, "pagos"));
  // Detalle de la transacción: cuentas en "Pago" (concepto, fecha y montos), lo que siguió en "Debe" y los totales de ese momento
  const row = x => ({ id: x.id, concept: x.concept || "", date: x.date, total: x.total, applied: x.applied });
  const detalle = {
    amount: p.amount,
    items: plan.detail.filter(x => x.status === "pago").map(row),
    pending: plan.detail.filter(x => x.status !== "pago").map(x => ({ ...row(x), left: x.left })),
    totals: { loans: plan.totals.loans, paid: plan.totals.paid, balance: plan.totals.balance }
  };
  const data = { client: name, key: k, amount: p.amount, date: p.date, method: p.method, detalle, createdAt: serverTimestamp(), ...(p.covers.length ? { covers: p.covers } : {}) };
  commit(errs, [...clientPays(k), { id: ref.id, amount: p.amount, date: p.date, method: p.method, covers: p.covers }], b => b.set(ref, data));
}

function finishPay(plan) {
  setReceipt(plan); marks.clear();
  toast(plan.remaining <= 0 ? "Cuenta saldada" : "Pago registrado");
  renderPay();
}

function pay(balance) {
  const amount = Math.min(getMoney($("#pAmt")), balance);
  if (amount <= 0) return toast("Escribe un monto válido");
  const plan = buildPlan(currentKey, amount, $("#pDate").value || today(), $("#pMethod").value, [...marks], true);
  registerPay(currentKey, plan); finishPay(plan);
}

/* Borra préstamos de Firestore sin descuadrar las cuentas: los abonos que los habían pagado se marcan "settled"
   (siguen sumando en "Cobrado este mes", pero ya no en el saldo del cliente) y lo que faltaba por pagar se registra como cobro. */
function settleLoans(k, ids, method = "otro", onlyPaid = false) {
  const errs = clientErrs(k), pays = clientPays(k), name = errs[0]?.client || "";
  const { paid, from } = allocateDetailed(errs, pays);
  const gone = errs.filter(e => ids.includes(e.id) && (!onlyPaid || paid[e.id] >= e.total));
  if (!gone.length) return null;
  const used = {}; let X = 0;
  for (const e of gone) {
    X += Math.max(0, e.total - paid[e.id]);
    for (const [pid, a] of Object.entries(from[e.id])) used[pid] = (used[pid] || 0) + a;
  }
  const keep = [], ops = [];
  for (const p of pays) {
    const c = used[p.id] || 0;
    if (c <= 0) { keep.push(p); continue; }
    if (c >= p.amount) ops.push(b => b.update(doc(db, "pagos", p.id), { settled: true }));
    else {
      ops.push(b => {
        b.update(doc(db, "pagos", p.id), { amount: p.amount - c });
        b.set(doc(collection(db, "pagos")), { client: name, key: k, amount: c, date: dayOf(p), method: p.method || "otro", settled: true, createdAt: serverTimestamp() });
      });
      keep.push({ ...p, amount: p.amount - c });
    }
  }
  if (X > 0) ops.push(b => b.set(doc(collection(db, "pagos")), { client: name, key: k, amount: X, date: today(), method, settled: true, createdAt: serverTimestamp() }));
  commit(errs.filter(e => !gone.includes(e)), keep, b => { gone.forEach(e => b.delete(doc(db, "mandados", e.id))); ops.forEach(f => f(b)); });
  return { n: gone.length, empty: gone.length === errs.length };
}

async function confirmDeletePaid() {
  const k = currentKey, n = clientErrs(k).filter(e => lastData.coveredIds.includes(e.id)).length;
  if (!n) return toast("Esos préstamos ya no existen");
  const r = await ask(`¿Borrar ${n} préstamo${n > 1 ? "s" : ""} ya pagado${n > 1 ? "s" : ""} de la base de datos? Quedarán solo las deudas pendientes; el cobro se conserva en "Cobrado este mes".`, { ok: "Borrar pagados" });
  if (r !== "ok") return;
  const res = settleLoans(k, lastData.coveredIds, "otro", true);
  if (!res) return toast("El pago aún se está guardando; inténtalo de nuevo");
  marks.clear(); lastReceipt = null;
  toast(`${res.n} préstamo${res.n > 1 ? "s" : ""} borrado${res.n > 1 ? "s" : ""}`);
  res.empty ? $("#dPay").close() : renderPay();
}

function openEdit(t, id) {
  const item = (t === "err" ? errands : payments).find(x => x.id === id); if (!item) return;
  const isErr = t === "err";
  editing = { t, id };
  $("#eTitle").textContent = isErr ? "Editar préstamo" : "Editar abono";
  $("#eConceptL").hidden = !isErr; $("#eConcept").required = isErr;
  $("#eMethodL").hidden = isErr;
  $("#eConcept").value = item.concept || "";
  setMoney($("#eAmt"), isErr ? item.total : item.amount);
  $("#eDate").max = today(); $("#eDate").value = dayOf(item);
  $("#eMethod").innerHTML = methodOptions(item.method || "efectivo");
  $("#dEdit").showModal();
}

$("#fEdit").addEventListener("submit", () => {
  const { t, id } = editing, amount = getMoney($("#eAmt")), date = $("#eDate").value || today();
  if (t === "err") {
    const k = norm(errands.find(x => x.id === id).client), concept = $("#eConcept").value.trim();
    const errs = clientErrs(k).map(x => x.id === id ? { ...x, concept, total: amount, date } : x);
    commit(errs, clientPays(k), b => b.update(doc(db, "mandados", id), { concept, lent: amount, total: amount, date }));
  } else {
    const k = payments.find(x => x.id === id).key, method = $("#eMethod").value;
    const pays = clientPays(k).map(x => x.id === id ? { ...x, amount, date, method } : x);
    commit(clientErrs(k), pays, b => b.update(doc(db, "pagos", id), { amount, date, method }));
  }
  toast("Cambios guardados");
});

async function remove(t, id) {
  const item = (t === "err" ? errands : payments).find(x => x.id === id); if (!item) return;
  const k = t === "err" ? norm(item.client) : item.key;
  const isErr = t === "err";
  const what = isErr ? `el préstamo "${item.concept}" por ${money(item.total)}` : `el abono de ${payLabel(item)} del ${fmtDate(dayOf(item))}`;
  const r = await ask(isErr
    ? `¿Qué hacer con ${what}? "Eliminar" lo borra sin registrar cobro. "Ya pagado" lo borra y suma ${money(pendingOf(item))} a lo cobrado.`
    : `¿Eliminar ${what}? El saldo del cliente se recalculará.`, { paid: isErr && pendingOf(item) > 0 });
  if (r === "paid") { settleLoans(k, [id]); toast("Préstamo pagado y borrado"); return; }
  if (r !== "ok") return;
  const errs = clientErrs(k).filter(e => t !== "err" || e.id !== id);
  const pays = clientPays(k).filter(p => t !== "pay" || p.id !== id);
  commit(errs, pays, b => b.delete(doc(db, t === "err" ? "mandados" : "pagos", id)));
  toast("Eliminado");
}

/* ---------- Comprobante WhatsApp ---------- */
function receipt(name, amount, detail, remaining, date, hist = [], method = "", totals = null, saved = false) {
  const pago = detail.filter(d => d.status === "pago"), debe = detail.filter(d => d.status !== "pago");
  const debeLine = d => `• ${fmtDate(d.date)} · ${d.concept}: ${money(d.total)}` + (d.applied > 0 ? ` (abono ${money(d.applied)}, queda ${money(d.left)})` : "");
  const abonos = hist.map(p => `• ${fmtDate(dayOf(p))}: ${payLabel(p)}`).join("\n");
  const t = totals || { loans: 0, paid: 0, balance: remaining };
  return [
    saved ? "🧾 *Comprobante de pago*" : "📋 *Estado de cuenta*",
    `📅 ${amount > 0 ? "Fecha del abono" : "Fecha"}: ${fmtDate(date)}`,
    `👤 Cliente: ${name}`,
    ...(amount > 0 ? [`💵 Monto abonado: *${money(amount)}*${MS[method] ? " - " + MS[method] : ""}`] : []),
    ...(pago.length ? ["", "✅ PAGO (cubiertos con este abono):", pago.map(d => `• ${fmtDate(d.date)} · ${d.concept}: ${money(d.applied)}`).join("\n")] : []),
    ...(debe.length ? ["", "⏳ DEBE (pendientes):", debe.map(debeLine).join("\n")] : []),
    ...(abonos ? ["", amount > 0 ? "Abonos anteriores:" : "Abonos:", abonos] : []),
    "",
    `Total préstamos: ${money(t.loans)}`, `Total abonos: ${money(t.paid)}`,
    `📌 ${amount > 0 ? "Saldo restante" : "Saldo total a pagar"}: *${money(t.balance)}*`,
    ...(remaining > 0 ? [] : ["✅ *Cuenta saldada. ¡Gracias!*"])
  ].filter((l, i, a) => l !== "" || a[i - 1] !== "").join("\n");
}

function receiptHTML(d) {
  const ok = d.remaining <= 0, t = d.totals, abono = d.amount > 0;
  const item = (title, sub, amt) => `
    <div class="r-it"><div class="r-t"><b>${esc(title)}</b><small>${sub}</small></div><span class="r-pill">${money(amt)}</span></div>`;
  // Con muchos registros la imagen se ensancha y las listas pasan a 2 columnas (la 1.ª mitad a la izquierda, la 2.ª a la derecha)
  const two = abono; // con abono: dos columnas, DEBE a la izquierda y PAGO (cruce) a la derecha
  const wide = !two && (d.detail.length > 6 || d.hist.length > 6);
  const rows = (arr, mk) => {
    const html = arr.map(mk);
    if (!wide || html.length < 2) return html.join("");
    const h = Math.ceil(html.length / 2);
    return `<div class="r-grid"><div class="r-gc">${html.slice(0, h).join("")}</div><div class="r-gc">${html.slice(h).join("")}</div></div>`;
  };
  const sec = (cls, icon, title, inner) => `<div class="r-blk ${cls}"><div class="r-sh"><span class="r-ic">${icon}</span><span class="r-sn hand">${title}</span></div>${inner}</div>`;
  const payRows = d.detail.filter(x => x.status === "pago"), debeRows = d.detail.filter(x => x.status !== "pago");
  const hasPaid = payRows.length > 0;
  const paidItem = x => item(x.concept, fmtDate(x.date) + (x.applied < x.total ? " · préstamo " + money(x.total) : ""), x.applied);
  const debeItem = x => item(x.concept, fmtDate(x.date) + (x.applied > 0 ? " · abono " + money(x.applied) + " · queda " + money(x.left) : ""), x.total);
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
  const noPay = `<div class="r-it"><div class="r-t"><b>Ningún ítem cubierto por completo</b></div></div>`;
  const twoCols = `<div class="r-two">
        <div class="r-col">${sec("", IC.wallet, "DEBE (PENDIENTES)",
          (debeRows.length ? rows(debeRows, debeItem) : `<div class="r-it"><div class="r-t"><b>Sin ítems pendientes</b></div></div>`) +
          `<div class="r-ap"><span>Pendiente tras el abono</span><strong>${money(sum(debeRows, x => x.left))}</strong></div>`)}</div>
        <div class="r-col">${sec("green", IC.hand, "PAGO (CRUCE)",
          (hasPaid ? rows(payRows, paidItem) : noPay) +
          `<div class="r-ap"><span>Monto abonado${MS[d.method] ? " · " + MS[d.method] : ""}</span><strong>${money(d.amount)}</strong></div>`)}</div>
      </div>`;
  const none = `<div class="r-it"><div class="r-t"><b>Sin préstamos pendientes</b></div></div>`;
  return `<div class="rcpt${wide ? " wide" : ""}${two ? " two" : ""}">
    <div class="r-head">
      <div class="r-hl">
        <p class="r-biz hand">${esc(BUSINESS)}</p>
        <p class="r-tw"><span class="r-title hand">${d.saved ? "Comprobante de pago" : "Estado de cuenta"}</span></p>
        <p class="r-date">${IC.cal}<span><small>${abono ? "Fecha del abono" : "Fecha"}</small><b>${fmtDate(d.date)}</b></span></p>
      </div>
      <div class="r-hr"><p class="r-tag hand">¡Tu esfuerzo también cuenta!</p>${IC.bag}</div>
    </div>
    <div class="r-frame">
      <div class="r-cli">
        <span class="r-av">${IC.user}</span>
        <div class="r-cn"><small>CLIENTE</small><b class="hand">${esc(d.name)}</b></div>
        <p class="r-thx hand">¡Gracias por confiar!</p>
      </div>
      ${two ? twoCols : sec("", IC.wallet, "DEBE (PENDIENTES)", debeRows.length ? rows(debeRows, debeItem) : none)}
      ${d.hist.length ? sec("green", IC.hand, abono ? "ABONOS ANTERIORES" : "ABONOS", rows(d.hist, p => item(MS[p.method] || "Abono", fmtDate(dayOf(p)), p.amount))) : ""}

const prevImg = () => `<img alt="Vista previa del comprobante" src="${lastImgUrl}">`;

async function makeImage(d) {
  if (!window.html2canvas) throw new Error("No se cargó html2canvas. Revisa tu conexión.");
  const stage = document.createElement("div");
  stage.className = "rcpt-stage"; stage.innerHTML = receiptHTML(d);
  document.body.appendChild(stage);
  try {
    try { // espera las tipografías (máx. 3 s) para que la imagen salga con el diseño correcto
      await Promise.race([
        Promise.all(["700 24px Kalam", "800 16px Nunito", "600 16px Nunito"].map(f => document.fonts.load(f))).then(() => document.fonts.ready),
        new Promise(r => setTimeout(r, 3000))
      ]);
    } catch {}
    const canvas = await html2canvas(stage, {
      scale: Math.min(3, Math.max(2, window.devicePixelRatio || 2)),
      backgroundColor: "#ffffff", useCORS: true, logging: false, scrollX: 0, scrollY: 0, windowWidth: Math.max(window.innerWidth, 800)
    });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    if (!blob) throw new Error("No se pudo generar la imagen");
    const slug = norm(d.name).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "cliente";
    return new File([blob], `${d.amount > 0 ? "comprobante" : "estado-cuenta"}-${slug}-${d.date}.png`, { type: "image/png" });
  } finally { stage.remove(); }
}

function getImage() {
  if (!lastImg) lastImg = makeImage(lastData).catch(e => { lastImg = null; throw e; });
  return lastImg;
}

function downloadFile(file) {
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function imageAction(btn, share, get = getImage, who = () => lastData.name) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Generando…";
  try {
    const file = await get();
    if (share && navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: BUSINESS + " - " + who() });
    } else {
      downloadFile(file);
      toast(share ? "Tu dispositivo no permite compartir; imagen descargada" : "Imagen guardada");
    }
  } catch (e) {
    if (e.name !== "AbortError") toast(e.message || "No se pudo crear la imagen");
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* ---------- Detalle / reenvío de un abono del historial ---------- */
let det = null; // { d, note, text, img, url } del abono abierto
const detImage = () => (det.img ||= makeImage(det.d).catch(e => { det.img = null; throw e; }));

// Arma los datos del comprobante de un abono ya registrado.
// Con detalle guardado se usa tal cual; sin él (abonos viejos o modificados después) se reconstruye con los préstamos actuales.
function abonoData(p) {
  const k = p.key, errs = clientErrs(k), pays = clientPays(k), s = p.detalle;
  const name = p.client || errs[0]?.client || "";
  let detail, totals, note = "";
  if (s && s.amount === p.amount) {
    detail = [...(s.items || []).map(x => ({ ...x, left: 0, status: "pago" })), ...(s.pending || []).map(x => ({ ...x, status: "debe" }))];
    totals = s.totals;
  } else {
    // Reconstrucción aproximada a la fecha del abono: solo los préstamos y abonos de ese día o anteriores.
    // Incluye también los préstamos que seguían debiéndose (aunque este abono no los tocara).
    const day = dayOf(p), errs2 = errs.filter(e => dayOf(e) <= day), pays2 = pays.filter(q => q.id === p.id || dayOf(q) <= day);
    const { paid, from } = allocateDetailed(errs2, pays2);
    detail = errs2.map(e => {
      const applied = from[e.id]?.[p.id] || 0, left = Math.max(0, e.total - paid[e.id]);
      return { id: e.id, concept: e.concept, date: dayOf(e), total: e.total, applied, left, status: left <= 0 ? "pago" : "debe" };
    }).filter(x => x.applied > 0 || x.left > 0);
    totals = totalsFrom(errs2, pays2);
    note = s ? "Este abono se modificó después de registrarse: el desglose se recalculó con los datos disponibles."
             : "Abono sin detalle guardado: el desglose se reconstruyó con los datos disponibles a la fecha del abono.";
  }
  return { note, d: { name, amount: p.amount, detail, hist: [], method: p.method || "", saved: true, date: dayOf(p), remaining: totals.balance, totals } };
}

function openDetail(id) {
  const p = payments.find(x => x.id === id); if (!p) return;
  if (det?.url) URL.revokeObjectURL(det.url);
  const { d, note } = abonoData(p);
  det = { d, note, img: null, url: null, text: receipt(d.name, d.amount, d.detail, d.remaining, d.date, d.hist, d.method, d.totals, true) };
  renderDetail(); $("#dDetail").showModal();
  const snap = det, show = html => { const el = $("#dPrev"); if (el && det === snap) el.innerHTML = html; };
  detImage().then(f => { if (det !== snap) return; snap.url ||= URL.createObjectURL(f); show(`<img alt="Vista previa del comprobante" src="${snap.url}">`); })
    .catch(() => show(`<pre class="msg">${esc(snap.text)}</pre>`));
}

function renderDetail() {
  const { d, note } = det, t = d.totals;
  const pago = d.detail.filter(x => x.status === "pago"), debe = d.detail.filter(x => x.status !== "pago");
  const li = (x, amt, sub) => `<li><span class="main">${esc(x.concept)}<small>${fmtDate(x.date)}${sub}</small></span><span class="amt">${money(amt)}</span></li>`;
  $("#detBody").innerHTML = `
    <h3>${esc(d.name)}</h3>
    <div class="total"><span>Abono · ${fmtDate(d.date)}${MS[d.method] ? " · " + MS[d.method] : ""}</span><strong>${money(d.amount)}</strong></div>
    ${note ? `<p class="hint">${esc(note)}</p>` : ""}
    <h4>Pago · cuentas pagadas con este abono</h4>
    <ul class="items">${pago.length ? pago.map(x => li(x, x.applied, x.applied < x.total ? ` · préstamo ${money(x.total)}` : "")).join("") : `<li><span class="main">Ninguna cuenta quedó cubierta por completo</span></li>`}</ul>
    ${debe.length ? `<h4>Debe · quedó pendiente</h4>
    <ul class="items">${debe.map(x => li(x, x.left, x.applied > 0 ? ` · abonó ${money(x.applied)} de ${money(x.total)}` : ` · préstamo ${money(x.total)}`)).join("")}</ul>` : ""}
    <div class="sum">
      <div class="s-loan"><small>Total préstamos / cargos</small><strong>${money(t.loans)}</strong></div>
      <div class="s-paid"><small>Total abonado</small><strong>${money(t.paid)}</strong></div>
      <div class="s-bal"><small>Saldo restante</small><strong>${money(t.balance)}</strong></div>
    </div>
    <div class="rcpt-prev" id="dPrev"><p class="empty">Generando comprobante…</p></div>
    <div class="actions">
      <button class="ghost" id="bdSave">⬇️ Guardar imagen</button>
      <button class="primary" id="bdShare">📤 Compartir imagen</button>
    </div>
    <div class="actions">
      <button class="ghost" id="bdCopy">Copiar texto</button>
      <button class="wa" id="bdWa">WhatsApp</button>
    </div>
    <button class="ghost" data-close>Cerrar</button>`;
  $("#bdSave").onclick = e => imageAction(e.currentTarget, false, detImage, () => det.d.name);
  $("#bdShare").onclick = e => imageAction(e.currentTarget, true, detImage, () => det.d.name);
  $("#bdCopy").onclick = () => navigator.clipboard.writeText(det.text).then(() => toast("Copiado"));
  $("#bdWa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(det.text), "_blank");
}
$("#dDetail").addEventListener("close", () => { if (det?.url) URL.revokeObjectURL(det.url); det = null; });

/* ---------- Estado de conexión ---------- */
const netEl = $("#net");
const net = () => netEl.hidden = navigator.onLine;
addEventListener("online", net); addEventListener("offline", net); net();
